version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
  - package-ecosystem: pip
    directories:
      - /.claude/skills/skill-evaluation
      - /.claude/skills/skill-evaluation/tests
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
